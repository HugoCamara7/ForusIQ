[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forusight"
version = "0.1.0"
description = "Reposición y distribución CD 320 → tiendas (Azaleia / Forus)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.50",
    "google-cloud-bigquery>=3.20",
    "db-dtypes>=1.2",
    "pandas>=2.1",
    "numpy>=1.26",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pandera>=0.20",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "xlsxwriter>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forusight = ["config/*.yaml", "config/*.csv", "data/queries/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/vistas/*.py" = ["N999"]

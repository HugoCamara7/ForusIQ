# Parámetros del motor Forusight. Editables desde la página "Parámetros".
# Unidades: semanas, pares (unidades) y fracciones 0-1 salvo que se indique.
# Los valores marcados PENDIENTE son supuestos hasta que Forus los confirme.

horizonte:
  semanas_analisis: 12          # ventana para estados, demanda y curva
  semanas_bloque_reciente: 4    # "4S"

disponibilidad:
  dias_min_exposicion: 14       # < 14 días con stock y sin venta => EXPOSICION_INSUFICIENTE
  quiebre_fraccion_core: 0.5    # modelo-color en QUIEBRE si >= 50% de sus tallas core están bajo el mínimo

demanda:
  exposicion_minima: 0.3        # venta / max(expo, 0.3)
  tope_correccion: 2.0          # la corrección nunca multiplica más de 2x
  pesos_bloques: [0.5, 0.3, 0.2]  # 4S / 5-8S / 9-12S
  volumen_min_pesos: 8          # pares en 12S para usar pesos recientes
  umbral_tendencia: 0.15        # |tasa4S/tasa12S - 1| mínimo para considerarla significativa
  tendencia_min: 0.85
  tendencia_max: 1.20
  aplicar_factor_tendencia: true
  factor_sin_historia: 0.7      # velocidad similares x índice categoría x 0.7
  indice_categoria_min: 0.5
  indice_categoria_max: 1.5

similitud:
  k_vecinos: 5                  # vecinos por coseno cuando la tienda no tiene cluster

curva:
  k_prior: 10                   # fuerza del prior bayesiano (pares equivalentes)
  n_min_nivel_prior: 20         # pares mínimos para aceptar un nivel del prior

cobertura:                      # PENDIENTE (h, i)
  lead_time_semanas: 1.0
  ciclo_revision_semanas: 1.0
  seguridad_semanas:
    alta: 0.0                   # la seguridad va en z·√(demanda·cobertura) por talla
    media: 0.0                  # (calibrado con el reporte del 24/09)
    baja: 0.0
  seguridad_z_talla: 0.5         # nivel por talla = redondeo(demanda·cobertura + z·√(demanda·cobertura))
  redondeo_nivel: cercano       # "cercano" (calibrado con el reporte del 24/09) o "arriba"
  factor_demanda_nivel: 1.0
  umbral_sobrestock_semanas: 12.0
  por_categoria: {}             # ej.: {"SANDALIA": {"lead_time_semanas": 1.5, "seguridad_semanas": {"alta": 1.5}}}

rotacion:
  percentil_alta: 0.67          # sell-through >= p67 dentro de la categoría => alta
  percentil_baja: 0.33          # sell-through < p33 => baja

exhibicion:                     # PENDIENTE (i)
  minimo_por_talla_core: 1
  minimo_por_talla_activa: 1     # reponer lo vendido: cada talla de un modelo que la tienda vende queda con >= 1
  completar_curva: false         # talla que nunca tuvo: sólo si el maestro de planificación la trae (30/09: 723 u extra, 5 % de acierto)
  minimo_por_categoria: {}      # ej.: {"BOTA": 2}
  tallas_core_default: ["36", "37", "38", "39"]
  tallas_core_por_genero:          # claves = valor de GENERO_MA en ARTI (mayúsculas)
    DAMA: ["36", "37", "38", "39"]
    MUJER: ["36", "37", "38", "39"]
    FEMENINO: ["36", "37", "38", "39"]
    CABALLERO: ["39", "40", "41", "42"]
    HOMBRE: ["39", "40", "41", "42"]
    MASCULINO: ["39", "40", "41", "42"]
    NINA: ["30", "31", "32", "33"]
    NIÑA: ["30", "31", "32", "33"]
    NINO: ["30", "31", "32", "33"]
    NIÑO: ["30", "31", "32", "33"]
  tallas_core_por_categoria: {}
  tallas_minimas_sin_core: 3    # curva mínima si el modelo no fabrica tallas core

tope_tienda:                    # PENDIENTE (i)
  max_unidades_por_sku: 12
  max_unidades_por_tienda: 600  # por corrida; dim_tienda.max_unidades_corrida lo sobrescribe

afinidad:
  introducir_modelos_nuevos: false  # los modelos nuevos entran por carga manual (como el reporte)
  umbral_introduccion: 0.45
  penalizacion_sin_venta: 0.2   # factor multiplicativo si TUVO_SIN_VENTA con exposición suficiente
  pesos:
    a1_historia_propia: 0.35
    a2_indice_tienda: 0.20
    a3_modelos_similares: 0.20
    a4_tiendas_similares: 0.15
    a5_presencia_historica: 0.10

asignacion:
  multiplo_envio: 1             # PENDIENTE (g): pares sueltos vs curvas cerradas
  pesos_prioridad:
    riesgo_quiebre: 0.30
    velocidad: 0.20               # demanda de la tienda
    afinidad: 0.10
    tendencia: 0.05
    importancia_comercial: 0.25   # prioridad de tienda (Jockey = 1) y peso de su venta
    bono_curva_rota: 0.10

prioridad_tiendas:              # tiendas que reciben primero y con más cobertura
  patrones: ["JOCKEY"]          # texto en el nombre de la tienda (HP JOCKEY, HPK JOCKEY, RKF JOCKEY…)
  factor_cobertura: 1.25        # su stock objetivo es 1.25x el de una tienda normal
  importancia: 1.0              # máxima prioridad al repartir el CD
  cadenas_liquidadoras: ["DH", "SE", "FB"]  # outlets: sin introducciones, últimas en el reparto
  factor_cobertura_liquidadora: 0.75
  importancia_liquidadora: 0.0
  niveles:                      # prioridad por venta (config/prioridad_tiendas.csv): A > B > C
    A: {factor_cobertura: 1.25, importancia: 1.0}
    B: {factor_cobertura: 1.0, importancia: 0.6}
    C: {factor_cobertura: 0.9, importancia: 0.25}
  paso_orden: 0.03              # dentro de la letra, cada puesto del «orden» resta 0.03 (Jockey 1º en las A)

recepcion:                      # tránsito = pedidos del sistema hacia la tienda (tablas de pedidos)
  transito_pedidos: true
  estados_transito: [1, 2, 3]         # Aprobado, en Picking, Documentado: todo el historial
  estados_transito_recientes: [6, 7]  # en Transporte, Prerecepcionado: sólo pedidos recientes
  dias_transito_recientes: 15         # más antiguo en 6/7 = ya llegó y quedó sin cerrar
  clasificaciones_transito: [1, 2, 3] # Reposición, Llenado de canal, Traspaso tiendas
  sumar_recepcion_post_corte: true    # recepcionado después del corte de stock_bi: se suma al stock físico

calendario:                     # días de reposición por tienda (config/calendario_tiendas.csv)
  aplicar: true                 # en un día sólo reciben las tiendas que reponen ese día
                                # (una tienda sin días en el calendario recibe cualquier día)
  leadtime_dias_defecto: 3.0
  revision_dias_defecto: 2.3

stock_cd:                       # qué parte del CD 320 se reparte a tiendas
  componentes: disponible       # disponible | tiendas+bodega-reservas | tiendas+bodega | tiendas | bodega (compáralo en Conexión)

reposicion_venta:               # reponer lo vendido desde la ruta anterior del mall
  reponer_venta_desde_ruta: true  # necesidad = max(nivel máximo − posición, venta desde la ruta anterior)
  dias_venta_diaria: 14
  solo_bajo_punto_reorden: true # como el reporte: lo vendido se repone cuando la talla llega a su punto de reorden
  descontar_venta_post_corte: true  # resta la venta neta posterior al corte de stock_bi (fecha F = cierre de F) hasta ayer

surtido:                        # qué se puede reponer
  # colecciones vigentes; las anteriores (VERANO 2025, ESCOLAR 2025…) no se reponen (vacío = todas)
  temporadas_reponer: ["INVIERNO 2026", "VERANO 2026", "ESCOLAR 2026", "INVIERNO 2027"]
  temporadas_en_bigquery: false # usar ARTI si el modelo-color no está en el maestro de temporadas

referencia:                     # niveles del último reporte de distribución de cada tienda
  usar_nivel_del_reporte: true  # nivel máximo y punto de reorden del reporte (subido en la barra lateral)
  reponer_venta_con_nivel_del_reporte: true   # con el nivel del reporte, lo vendido se repone al llegar al punto de reorden
  dias_maximos: 10              # antigüedad máxima del reporte de referencia

nivel_neo:                      # nivel y punto de reorden con la estructura del reporte (engine/nivel_neo.py)
  activo: true                  # pronóstico = k × venta 4 semanas × curva nacional; nivel = max(SMT, ceil(d + z·√d)); reorden = nivel − 1
  z: 0.84
  nivel_reporte_como_piso: false  # no: la fórmula se pasa en tallas de alta rotación
  dias_maximos: 60              # antigüedad máxima del maestro de planificación (SMT por tienda × SKU)
  dias_nivel_reporte: 3         # clave de un reporte de <= 3 días: su nivel y reorden tal cual (89,7 % el 30/09)
  banda_reporte: false          # con la fórmula, reorden = nivel − 1
  universo: listada_reciente    # talla con stock/tránsito/venta y modelo con venta reciente, o talla de un reporte reciente
